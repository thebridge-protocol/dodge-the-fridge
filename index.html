<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DODGE THE SMART FRIDGE — Arcade</title>
  <style>
    body { background:#111126; color:white; font-family:Arial, sans-serif; text-align:center; margin:0; padding:15px; overflow:hidden; }
    h2 { color:#c9a5ff; margin:5px 0; }
    #hud { font-size:18px; margin-bottom:10px; color:#d0c4ff; }
    canvas { background:#0d0d1f; border:2px solid #c9a5ff; border-radius:16px; display:block; margin:0 auto; max-width:100%; touch-action:none; }
    .controls { display:flex; justify-content:center; gap:20px; margin-top:12px; }
    button { background:#252547; color:white; border:1px solid #c9a5ff; border-radius:12px; padding:12px 24px; font-size:18px; cursor:pointer; }
    a { color:#c9a5ff; display:inline-block; margin-top:14px; text-decoration:none; font-size:14px; }
  </style>
</head>
<body>

  <h2>🎮 DODGE THE SMART FRIDGE</h2>
  <div id="hud">Score: <span id="score">0</span> | Best: <span id="best">0</span></div>
  <canvas id="game" width="360" height="440"></canvas>

  <div class="controls">
    <button onpointerdown="move(-35)">⬅️ Left</button>
    <button onclick="resetGame()">🔄 Restart</button>
    <button onpointerdown="move(35)">Right ➡️</button>
  </div>
  <a href="https://github.io">← Visit THE ORIGINAL DUO</a>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let player = { x: 160, y: 390 };
    let items = [];
    let score = 0;
    let best = localStorage.getItem('duo_best') || 0;
    let alive = true;
    document.getElementById('best').textContent = best;

    function move(dx) {
      if (!alive) return;
      player.x = Math.max(10, Math.min(canvas.width - 42, player.x + dx));
    }

    canvas.addEventListener('pointermove', e => {
      if (!alive) return;
      const rect = canvas.getBoundingClientRect();
      player.x = Math.max(10, Math.min(canvas.width - 42, (e.clientX - rect.left) * (canvas.width / rect.width) - 16));
    });

    function resetGame() {
      player.x = 160;
      items = [];
      score = 0;
      alive = true;
      document.getElementById('score').textContent = 0;
    }

    setInterval(() => {
      if (!alive) return;
      const bad = Math.random() < 0.65;
      const icons = bad ? ['🧊', '🪟'] : ['💜', '💙', '🍿'];
      items.push({
        x: Math.random() * (canvas.width - 30),
        y: -30,
        speed: 3 + Math.random() * 2.5 + score * 0.05,
        bad: bad,
        icon: icons[Math.floor(Math.random() * icons.length)]
      });
    }, 650);

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = '28px Arial';
      ctx.fillText('❤️', player.x, player.y + 26);

      items.forEach((it, i) => {
        if (alive) it.y += it.speed;
        ctx.fillText(it.icon, it.x, it.y + 26);

        if (alive && Math.abs(it.x - player.x) < 26 && Math.abs(it.y - player.y) < 26) {
          if (it.bad) {
            alive = false;
            if (score > best) { best = score; localStorage.setItem('duo_best', best); document.getElementById('best').textContent = best; }
          } else {
            score += 10;
            document.getElementById('score').textContent = score;
            items.splice(i, 1);
          }
        }
      });

      items = items.filter(it => it.y < canvas.height + 40);

      if (!alive) {
        ctx.fillStyle = 'rgba(17,17,38,0.85)';
        ctx.fillRect(30, 160, 300, 110);
        ctx.fillStyle = '#c9a5ff';
        ctx.font = 'bold 20px Arial';
        ctx.fillText('🧊 SMART FRIDGE GOT YOU!', 50, 205);
        ctx.fillStyle = 'white';
        ctx.font = '15px Arial';
        ctx.fillText('Tap Restart to play again', 95, 240);
      }
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
